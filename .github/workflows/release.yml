name: Release

# master 로 Pull Request 가 "머지"될 때 실행됩니다.
# FyneApp.toml 의 Version 으로 태그(vX.Y.Z)를 정하고, 그 태그가 아직 없을 때만
# (= 버전을 올린 PR 이 머지될 때만) 빌드 → 패키징 → 릴리스합니다.
#   릴리스하려면: FyneApp.toml 의 Version 을 올린 PR 을 master 로 머지하세요.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write # 릴리스 생성 · 태그 push · 자산 업로드 권한

jobs:
  # ── 머지된 PR인지 확인하고, FyneApp.toml 버전으로 릴리스 여부를 결정 ──
  check:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide release from FyneApp.toml version
        id: decide
        run: |
          VERSION=$(grep -E '^[[:space:]]*Version[[:space:]]*=' FyneApp.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::FyneApp.toml 에서 Version 을 읽지 못했습니다."
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 태그가 이미 존재 → 릴리스 건너뜀 (버전 미변경)"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 릴리스를 진행합니다."
          fi

  # ── Windows .exe (Linux 러너 + fyne-cross/Docker, 로컬과 동일 파이프라인) ──
  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install fyne-cross
        run: |
          go install github.com/fyne-io/fyne-cross@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Windows exe
        run: fyne-cross windows -arch=amd64 -app-id com.hanson.translator

      - name: Package (영문 파일명 → 어느 압축도구로든 풀림)
        run: |
          unzip -o -j fyne-cross/dist/windows-amd64/*.exe.zip -d _win
          mv _win/*.exe HansonTranslator.exe
          zip -j HansonTranslator-windows-amd64.zip HansonTranslator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            HansonTranslator.exe
            HansonTranslator-windows-amd64.zip

  # ── macOS .app (Apple Silicon 러너에서 네이티브 빌드) ──
  build-macos:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install fyne tool
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app
        run: fyne package -os darwin

      - name: Package
        run: ditto -c -k --keepParent "한슨어 번역기.app" HansonTranslator-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: HansonTranslator-macOS-arm64.zip

  # ── 두 빌드를 모아 태그를 만들고 릴리스 생성 ──
  release:
    needs: [check, build-windows, build-macos]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: "한슨어 번역기 ${{ needs.check.outputs.tag }} 🐢"
          files: dist/**
          fail_on_unmatched_files: true
          body: |
            한국어를 **한슨어**로 바꿔주는 데스크톱 앱입니다. 상단에서 `슨체`/`누체` 말투를 골라 문장 끝을 재밌게 바꿉니다.

            ## 다운로드
            | OS | 파일 | 실행 |
            |----|------|------|
            | 🪟 Windows | **`HansonTranslator.exe`** (압축 없음, 추천) | 다운로드 후 바로 더블클릭 |
            | 🪟 Windows | `HansonTranslator-windows-amd64.zip` | 압축 풀고 `.exe` 더블클릭 |
            | 🍎 macOS (Apple Silicon) | `HansonTranslator-macOS-arm64.zip` | 압축 풀고 `.app` 더블클릭 |

            ## ⚠️ 처음 실행 시
            코드 서명이 없어 경고가 뜰 수 있습니다.
            - **Windows**: "PC 보호" 창 → 추가 정보 → 실행
            - **macOS**: 앱 우클릭 → 열기 → 열기

            자세한 변경 사항은 [CHANGELOG.md](https://github.com/yunhwane/hanson-desktop-app/blob/master/CHANGELOG.md)를 참고하세요.
